[project]
name = "pulse-backend"
version = "0.2.0"
description = ""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arrow>=1.3.0",
    "cachetools>=5.5",
    "click>=8.1.8",
    "fastapi>=0.143.0",
    "fastapi-cli>=0.0.32",
    "uvicorn[standard]>=0.38.0",
    "psycopg[binary]>=3.2.6",
    "pydantic>=2.11.3",
    "requests>=2.32.3",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
